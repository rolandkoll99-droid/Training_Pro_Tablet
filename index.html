<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESV Grein – Trainingswertung (Querformat)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #1f5e3a;
      --red: #b93a32;
      --gold: #ffdf8c;
      --dark: #102417;
      --light: #eef5e9;
      --border: #d7e4cf;
      --radius: 18px;
      --shadow: 0 8px 24px rgba(0, 0, 0, .25);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #17351f, #0d1f13);
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 1280px;
      height: 100vh;
      max-height: 800px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(2px);
      border-radius: var(--radius);
      padding: 8px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: var(--green);
      color: white;
      padding: 10px 16px;
      border-radius: var(--radius) var(--radius) 0 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 12px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: clamp(1.1rem, 2.2vw, 1.8rem);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .header-controls select,
    .header-controls button {
      background: white;
      color: #1f5e3a;
      border: none;
      border-radius: 40px;
      padding: 6px 14px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: 0.1s;
    }

    .header-controls button {
      background: var(--gold);
      color: #1f3a22;
    }
    .header-controls button:hover {
      filter: brightness(0.92);
      transform: scale(0.96);
    }

    .arena {
      background: white;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 12px 14px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .arena-top {
      flex-shrink: 0;
      margin-bottom: 10px;
    }

    .arena-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .arena-header input[type="text"] {
      font-size: 0.95rem;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 40px;
      padding: 6px 14px;
      max-width: 200px;
      background: var(--light);
      color: #0d2b18;
    }

    .bahn-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .bahn-selector strong {
      color: #1f5e3a;
      font-size: 0.9rem;
    }
    .bahn-btn {
      background: #eef3ea;
      border: 2px solid transparent;
      border-radius: 40px;
      padding: 4px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      min-width: 38px;
    }
    .bahn-btn.active {
      background: var(--gold);
      border-color: #1f5e3a;
    }

    .team-inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .team-inputs input {
      border: 2px solid var(--border);
      border-radius: 40px;
      padding: 6px 12px;
      font-weight: 600;
      background: #fafff9;
      text-align: center;
      font-size: 0.95rem;
    }
    .team-inputs div {
      display: flex;
      align-items: center;
      font-weight: 900;
      color: var(--green);
      font-size: 1rem;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .score-card {
      background: #f7faf5;
      border-radius: 20px;
      padding: 10px 8px 8px;
      text-align: center;
      border-bottom: 6px solid var(--green);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.3s;
      position: relative;
    }
    .score-card.red {
      border-bottom-color: var(--red);
    }
    .score-card.winner {
      border-bottom-color: var(--gold);
      background: #fff9e6;
      box-shadow: 0 0 0 3px var(--gold);
    }
    .score-card.winner .team-score {
      color: var(--dark);
    }
    .winner-badge {
      position: absolute;
      top: -12px;
      right: -8px;
      background: var(--gold);
      color: var(--dark);
      font-weight: 900;
      font-size: 0.7rem;
      padding: 2px 14px;
      border-radius: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      letter-spacing: 0.5px;
      border: 2px solid white;
    }
    .team-name {
      font-size: clamp(0.95rem, 1.6vw, 1.3rem);
      font-weight: 800;
    }
    .team-score {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 900;
      color: var(--green);
      line-height: 1.1;
    }
    .team-points {
      font-weight: 600;
      font-size: 0.8rem;
    }
    .team-points span {
      display: inline-block;
      background: var(--dark);
      color: white;
      padding: 2px 14px;
      border-radius: 40px;
      font-size: 1.2rem;
      font-weight: 800;
      margin-top: 2px;
    }

    .kehren-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 6px;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--green) #e8efe4;
    }
    .kehren-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .kehren-scroll::-webkit-scrollbar-track {
      background: #e8efe4;
      border-radius: 10px;
    }
    .kehren-scroll::-webkit-scrollbar-thumb {
      background: var(--green);
      border-radius: 10px;
    }

    .kehren {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
    }

    .kehren-title {
      text-align: center;
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #1f3a22;
      border-bottom: 2px dashed var(--border);
      padding-bottom: 4px;
    }

    .kehre-row {
      display: grid;
      grid-template-columns: 55px 1fr 36px;
      align-items: center;
      gap: 4px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 40px;
      padding: 2px 4px 2px 12px;
      margin-bottom: 6px;
      min-height: 40px;
      transition: 0.1s;
    }
    .kehre-row.active {
      border: 3px solid #2e7d4e;
      background: #f3fff2;
      box-shadow: 0 0 0 2px rgba(31, 94, 58, 0.15);
    }
    .kehre-row.disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.4);
    }

    .kehre-number {
      font-weight: 700;
      font-size: 0.75rem;
      color: #1f5e3a;
    }

    .points {
      display: flex;
      gap: 3px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .point-btn {
      min-width: 28px;
      height: 28px;
      border-radius: 40px;
      border: 2px solid var(--border);
      background: white;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .point-btn:hover:not(:disabled) {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .point-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .kehre-value {
      text-align: center;
      font-weight: 900;
      font-size: 1rem;
      background: #eef5e9;
      border-radius: 40px;
      padding: 2px 0;
      min-width: 28px;
    }

    .footer {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding-top: 8px;
      border-top: 2px solid var(--border);
      margin-top: 2px;
    }
    .footer button {
      border: none;
      border-radius: 60px;
      padding: 8px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      background: #e4eee0;
      color: #1f3a22;
      transition: 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .footer button.gold {
      background: var(--gold);
      color: #1f3a22;
    }
    .footer button:hover:not(:disabled) {
      transform: scale(0.96);
      filter: brightness(0.94);
    }
    .footer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1d2f1d;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      z-index: 999;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
    }

    @media (max-height: 700px) {
      .header { padding: 6px 12px; }
      .header h1 { font-size: 1rem; }
      .header-controls select,
      .header-controls button { padding: 4px 10px; font-size: 0.7rem; }
      .arena { padding: 8px 10px; }
      .team-inputs { gap: 6px; margin-bottom: 6px; }
      .team-inputs input { padding: 4px 8px; font-size: 0.8rem; }
      .score-card { padding: 6px 4px; }
      .team-score { font-size: 2rem; }
      .team-points span { font-size: 1rem; padding: 0 10px; }
      .kehre-row { min-height: 32px; padding: 0 4px 0 8px; }
      .point-btn { min-width: 24px; height: 24px; font-size: 0.7rem; }
      .footer button { padding: 4px 12px; font-size: 0.75rem; }
    }

    @media (max-width: 700px) {
      .team-inputs { grid-template-columns: 1fr; gap: 4px; }
      .team-inputs div { justify-content: center; }
    }

    @media (min-width: 1200px) {
      .kehre-row { grid-template-columns: 70px 1fr 44px; }
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="header">
    <h1>🥌 ESV Grein</h1>
    <div class="header-controls">
      <select id="gamesSelect">
        <option value="2" selected>2 Siege</option>
        <option value="3">3 Siege</option>
        <option value="4">4 Siege</option>
        <option value="5">5 Siege</option>
        <option value="6">6 Siege</option>
      </select>
      <select id="kehrenSelect">
        <option value="4">4 Kehren</option>
        <option value="6" selected>6 Kehren</option>
        <option value="8">8 Kehren</option>
        <option value="10">10 Kehren</option>
        <option value="12">12 Kehren</option>
      </select>
      <button type="button" onclick="openSpectatorWindow()">📺 Monitor</button>
      <button type="button" onclick="fullReset()">🔄 Reset</button>
    </div>
  </div>

  <div class="arena" id="arenaContainer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function() {
    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }
    function sum(arr) {
      return arr.reduce((a, b) => a + (b || 0), 0);
    }

    const state = {
      kehren: 6,
      winsToChampion: 2,
      arena: null,
      autoEvaluateEnabled: true // Automatik aktiv
    };

    function createArena(id) {
      return {
        id,
        arenaName: 'Training',
        bahn: 1,
        teamA: 'Mannschaft W',
        teamB: 'Mannschaft E',
        pointsA: Array(state.kehren).fill(null),
        pointsB: Array(state.kehren).fill(null),
        winsA: 0,
        winsB: 0,
        finished: false
      };
    }
    state.arena = createArena(1);

    const arenaContainer = document.getElementById('arenaContainer');
    const toastEl = document.getElementById('toast');
    let evaluateTimeout = null;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    function hasWinner(arena) {
      return arena.winsA >= state.winsToChampion || arena.winsB >= state.winsToChampion;
    }

    function getWinner(arena) {
      if (arena.winsA >= state.winsToChampion) return 'A';
      if (arena.winsB >= state.winsToChampion) return 'B';
      return null;
    }

    function getWinnerName(arena) {
      const w = getWinner(arena);
      if (w === 'A') return arena.teamA;
      if (w === 'B') return arena.teamB;
      return '';
    }

    // Prüft ob alle Kehren ausgefüllt sind und führt automatische Wertung durch
    function checkAndAutoEvaluate() {
      const arena = state.arena;
      if (!state.autoEvaluateEnabled) return false;
      if (arena.finished || hasWinner(arena)) return false;

      // Prüfen ob alle Kehren ausgefüllt sind
      let allFilled = true;
      for (let i = 0; i < state.kehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
          allFilled = false;
          break;
        }
      }

      if (allFilled) {
        // Verzögerte Ausführung damit die UI sich aktualisieren kann
        clearTimeout(evaluateTimeout);
        evaluateTimeout = setTimeout(() => {
          performEvaluate();
        }, 150);
        return true;
      }
      return false;
    }

    function performEvaluate() {
      const arena = state.arena;
      if (arena.finished || hasWinner(arena)) return;
      
      // Nochmal prüfen ob alle Kehren ausgefüllt sind
      for (let i = 0; i < state.kehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
          return;
        }
      }

      const a = sum(arena.pointsA);
      const b = sum(arena.pointsB);
      
      let msg = '';
      if (a > b) {
        arena.winsA++;
        msg = `${arena.teamA} gewinnt das Spiel (${a}:${b})`;
      } else if (b > a) {
        arena.winsB++;
        msg = `${arena.teamB} gewinnt das Spiel (${a}:${b})`;
      } else {
        msg = `Unentschieden (${a}:${b}) – kein Punkt`;
      }
      
      toast(msg);
      
      // Kehren zurücksetzen für nächste Runde
      arena.pointsA = Array(state.kehren).fill(null);
      arena.pointsB = Array(state.kehren).fill(null);

      // Prüfen ob ein Sieger feststeht
      if (hasWinner(arena)) {
        arena.finished = true;
        const winner = getWinnerName(arena);
        toast(`🏆 ${winner} gewinnt das Training mit ${state.winsToChampion} Siegen!`);
      } else {
        // Nächste Runde
        toast(`Nächste Runde – ${msg}`);
      }
      
      render();
    }

    function render() {
      if (!arenaContainer) return;
      arenaContainer.innerHTML = renderArena(state.arena);
      updateSpectatorWindow();
    }

    function renderArena(arena) {
      const scoreA = sum(arena.pointsA);
      const scoreB = sum(arena.pointsB);
      const winner = getWinner(arena);
      const isFinished = arena.finished || hasWinner(arena);

      return `
        <div class="arena-top">
          <div class="arena-header">
            <input type="text" value="${escapeHTML(arena.arenaName)}" 
                   onchange="window.setArenaName(this.value)" placeholder="Trainingsname">
            <div class="bahn-selector">
              <strong>🎯 Bahn</strong>
              ${[1,2,3,4].map(b => `
                <button type="button" class="bahn-btn ${arena.bahn === b ? 'active' : ''}" 
                        onclick="window.setBahn(${b})">${b}</button>
              `).join('')}
            </div>
          </div>

          <div class="team-inputs">
            <input type="text" value="${escapeHTML(arena.teamA)}" onchange="window.setTeam('A', this.value)" ${isFinished ? 'disabled style="opacity:0.6;"' : ''}>
            <div>VS</div>
            <input type="text" value="${escapeHTML(arena.teamB)}" onchange="window.setTeam('B', this.value)" ${isFinished ? 'disabled style="opacity:0.6;"' : ''}>
          </div>

          <div class="scoreboard">
            <div class="score-card ${winner === 'A' ? 'winner' : ''}">
              ${winner === 'A' ? '<div class="winner-badge">🏆 SIEGER</div>' : ''}
              <div class="team-name">${escapeHTML(arena.teamA)}</div>
              <div class="team-score">${scoreA}</div>
              <div class="team-points">Gewonnene Spiele<br><span>${arena.winsA}</span></div>
            </div>
            <div class="score-card ${winner === 'B' ? 'winner' : ''} red">
              ${winner === 'B' ? '<div class="winner-badge">🏆 SIEGER</div>' : ''}
              <div class="team-name">${escapeHTML(arena.teamB)}</div>
              <div class="team-score">${scoreB}</div>
              <div class="team-points">Gewonnene Spiele<br><span>${arena.winsB}</span></div>
            </div>
          </div>
        </div>

        <div class="kehren-scroll">
          <div class="kehren">
            <div>
              <div class="kehren-title">${escapeHTML(arena.teamA)}</div>
              ${renderKehren(arena, 'A', isFinished)}
            </div>
            <div>
              <div class="kehren-title">${escapeHTML(arena.teamB)}</div>
              ${renderKehren(arena, 'B', isFinished)}
            </div>
          </div>
        </div>

        <div class="footer">
          <button type="button" class="gold" onclick="window.manualEvaluate()" ${isFinished ? 'disabled' : ''}>
            ${isFinished ? '🏁 Beendet' : '🏆 Manuell werten'}
          </button>
          <button type="button" onclick="window.resetCurrent()" ${isFinished ? 'disabled' : ''}>
            ${isFinished ? '🔒 Gesperrt' : '🔄 Kehren löschen'}
          </button>
          ${isFinished ? `<button type="button" onclick="window.fullReset()" style="background:var(--gold);">🆕 Neues Spiel</button>` : ''}
          <button type="button" onclick="window.toggleAutoEvaluate()" style="${state.autoEvaluateEnabled ? 'background:var(--green);color:white;' : 'background:#ddd;'}">
            ${state.autoEvaluateEnabled ? '✅ Auto' : '⏸️ Manuell'}
          </button>
        </div>
      `;
    }

    function renderKehren(arena, team, isFinished) {
      const arr = team === 'A' ? arena.pointsA : arena.pointsB;
      let html = '';
      for (let i = 0; i < state.kehren; i++) {
        const active = !isFinished && (activeKehre(arena) === i + 1);
        const disabled = isFinished || hasWinner(arena);
        html += `
          <div class="kehre-row ${active ? 'active' : ''} ${disabled ? 'disabled' : ''}">
            <div class="kehre-number">Kehre ${i+1}</div>
            <div class="points">
              ${[0,1,2,3,4].map(v => `
                <button type="button" class="point-btn" 
                        onclick="window.setPoints('${team}', ${i}, ${v})"
                        ${disabled ? 'disabled' : ''}>
                  ${v}
                </button>
              `).join('')}
            </div>
            <div class="kehre-value">${arr[i] ?? '-'}</div>
          </div>
        `;
      }
      return html;
    }

    function activeKehre(arena) {
      for (let i = 0; i < state.kehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) return i + 1;
      }
      return state.kehren;
    }

    // ---- Globale Funktionen ----
    window.setPoints = function(team, index, value) {
      const arena = state.arena;
      if (hasWinner(arena) || arena.finished) {
        toast('Spiel bereits beendet!');
        return;
      }
      if (team === 'A') {
        arena.pointsA[index] = value;
        if (arena.pointsB[index] === null) arena.pointsB[index] = 0;
      } else {
        arena.pointsB[index] = value;
        if (arena.pointsA[index] === null) arena.pointsA[index] = 0;
      }
      render();
      
      // Automatische Wertung prüfen (nach Render damit UI aktuell ist)
      setTimeout(() => {
        checkAndAutoEvaluate();
      }, 50);
    };

    window.manualEvaluate = function() {
      const arena = state.arena;
      if (hasWinner(arena) || arena.finished) {
        toast('Spiel bereits beendet!');
        return;
      }
      // Prüfen ob alle Kehren ausgefüllt sind
      for (let i = 0; i < state.kehren; i++) {
        if (arena.pointsA[i] === null || arena.pointsB[i] === null) {
          toast('Bitte alle Kehren ausfüllen');
          return;
        }
      }
      performEvaluate();
    };

    window.toggleAutoEvaluate = function() {
      state.autoEvaluateEnabled = !state.autoEvaluateEnabled;
      toast(state.autoEvaluateEnabled ? 'Auto-Wertung aktiviert' : 'Auto-Wertung deaktiviert');
      render();
    };

    window.setBahn = function(bahn) {
      if (state.arena.finished) {
        toast('Spiel beendet – Reset für neue Bahn');
        return;
      }
      state.arena.bahn = bahn;
      render();
    };

    window.setArenaName = function(name) {
      state.arena.arenaName = name;
      render();
    };

    window.setTeam = function(team, name) {
      if (state.arena.finished) {
        toast('Spiel beendet – Reset für neue Teams');
        return;
      }
      if (team === 'A') state.arena.teamA = name;
      else state.arena.teamB = name;
      render();
    };

    window.resetCurrent = function() {
      if (state.arena.finished) {
        toast('Spiel beendet – verwende "Neues Spiel"');
        return;
      }
      state.arena.pointsA = Array(state.kehren).fill(null);
      state.arena.pointsB = Array(state.kehren).fill(null);
      render();
    };

    window.fullReset = function() {
      state.arena = createArena(1);
      state.arena.finished = false;
      render();
      toast('Neues Spiel gestartet');
    };

    // ---- Spectator ----
    let spectatorWindow = null;
    window.openSpectatorWindow = function() {
      spectatorWindow = window.open('', 'spectator', 'width=1280,height=800');
      if (!spectatorWindow) {
        alert('Bitte Popups erlauben für den Zuschauer-Monitor.');
        return;
      }
      spectatorWindow.document.write(`
        <html><head><title>Zuschauer Monitor</title>
        <style>
          * { margin:0; padding:0; box-sizing:border-box; }
          body { background:#102417; color:white; font-family:Segoe UI,sans-serif; padding:20px; display:flex; align-items:center; justify-content:center; min-height:100vh; }
          .card { background:white; color:#1f3a22; border-radius:40px; padding:30px 40px; max-width:1000px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.6); }
          .title { font-size:2.6rem; font-weight:900; margin-bottom:8px; }
          .bahn { display:inline-block; background:#ffdf8c; padding:6px 18px; border-radius:40px; font-weight:700; margin-bottom:20px; }
          .teams { display:grid; grid-template-columns:1fr 1fr; gap:30px; margin-top:10px; }
          .team { background:#f5f8f3; border-radius:30px; padding:20px; text-align:center; position:relative; }
          .team.winner { background:#fff9e6; border:3px solid #ffdf8c; }
          .name { font-size:2.2rem; font-weight:800; }
          .score { font-size:6rem; font-weight:900; color:#1f5e3a; line-height:1; }
          .wins { font-size:2rem; font-weight:700; margin-top:8px; }
          .badge { position:absolute; top:-10px; right:-10px; background:#ffdf8c; color:#1f3a22; padding:2px 16px; border-radius:40px; font-weight:900; font-size:0.8rem; border:2px solid white; }
          @media (max-width:700px){ .title{font-size:2rem;} .score{font-size:4rem;} .name{font-size:1.6rem;} }
        </style>
        </head><body>
        <div class="card" id="specGrid"></div>
        </body></html>
      `);
      spectatorWindow.document.close();
      updateSpectatorWindow();
    };

    function updateSpectatorWindow() {
      if (!spectatorWindow || spectatorWindow.closed) return;
      const grid = spectatorWindow.document.getElementById('specGrid');
      if (!grid) return;
      const arena = state.arena;
      const winner = getWinner(arena);
      grid.innerHTML = `
        <div class="title">${escapeHTML(arena.arenaName)}</div>
        <div class="bahn">🎯 Bahn ${arena.bahn} ${arena.finished ? '🏁' : ''}</div>
        <div class="teams">
          <div class="team ${winner === 'A' ? 'winner' : ''}">
            ${winner === 'A' ? '<div class="badge">🏆 SIEGER</div>' : ''}
            <div class="name">${escapeHTML(arena.teamA)}</div>
            <div class="score">${sum(arena.pointsA)}</div>
            <div class="wins">🏆 ${arena.winsA}</div>
          </div>
          <div class="team ${winner === 'B' ? 'winner' : ''}">
            ${winner === 'B' ? '<div class="badge">🏆 SIEGER</div>' : ''}
            <div class="name">${escapeHTML(arena.teamB)}</div>
            <div class="score">${sum(arena.pointsB)}</div>
            <div class="wins">🏆 ${arena.winsB}</div>
          </div>
        </div>
        ${arena.finished ? `<div style="text-align:center;margin-top:20px;font-size:1.8rem;font-weight:900;color:#1f5e3a;">🏆 ${getWinnerName(arena)} gewinnt!</div>` : ''}
      `;
    }

    // ---- Selector Events ----
    document.getElementById('kehrenSelect').addEventListener('change', function(e) {
      if (state.arena.finished) {
        toast('Spiel beendet – Reset für neue Kehrenanzahl');
        return;
      }
      const newVal = Number(e.target.value);
      state.kehren = newVal;
      const a = state.arena;
      while (a.pointsA.length < newVal) a.pointsA.push(null);
      while (a.pointsB.length < newVal) a.pointsB.push(null);
      a.pointsA.length = newVal;
      a.pointsB.length = newVal;
      render();
    });

    document.getElementById('gamesSelect').addEventListener('change', function(e) {
      if (state.arena.finished) {
        toast('Spiel beendet – Reset für neue Sieganzahl');
        return;
      }
      state.winsToChampion = Number(e.target.value);
      render();
    });

    // ---- Start ----
    render();

    setInterval(() => {
      if (spectatorWindow && !spectatorWindow.closed) updateSpectatorWindow();
    }, 2200);

  })();
</script>
</body>
</html>
